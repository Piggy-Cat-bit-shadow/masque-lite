listen: 127.0.0.1:4433
tls:
  # Generated with: masque-lite server-keygen -cert /etc/masque-lite/server.crt -key /etc/masque-lite/server.key
  # Must be an independent P-256 ECDSA certificate, not an RSA wildcard certificate.
  cert: /etc/masque-lite/server.crt
  key: /etc/masque-lite/server.key
client:
  public_keys: []
  tunnel_ipv4: 192.0.2.2/32
# For multiple devices, replace the legacy client block with:
# clients:
#   - name: iphone
#     public_keys: [KEY_DEVICE_A]
#     tunnel_ipv4: 192.0.2.2/32
#   - name: mac
#     public_keys: [KEY_DEVICE_B]
#     tunnel_ipv4: 192.0.2.3/32
server:
  tunnel_ipv4: 192.0.2.1/30
  mtu: 1280
